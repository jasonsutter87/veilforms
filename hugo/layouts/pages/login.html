{{ define "main" }}
<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your VeilForms account</p>

    <div class="error-message" id="error-message" role="alert"></div>

    <a class="btn" href="/api/auth/gatekeep/login?next=/dashboard/">Continue with passkey</a>

    <div class="auth-links">
      <p>Sign-in is handled by <a href="https://gatekeepauth.com" rel="noopener">Gatekeep</a>: a passkey on your device, no password to remember. Your existing account is found by its email.</p>
      <p>New here? The same button creates your account.</p>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var messages = {
    expired: 'That sign-in took too long or was started in another tab. Please try again.',
    cancelled: 'Sign-in was cancelled.',
    unverified: 'Your Gatekeep email address isn’t verified yet. Verify it in Gatekeep, then try again.',
    signin: 'That sign-in didn’t check out. Please try again.',
    unavailable: 'The sign-in service is unavailable right now. Please try again shortly.'
  };
  var code = new URLSearchParams(window.location.search).get('error');
  var box = document.getElementById('error-message');
  if (code && box) {
    box.textContent = messages[code] || 'Sign-in failed. Please try again.';
    box.style.display = 'block';
  }
});
</script>
{{ end }}
